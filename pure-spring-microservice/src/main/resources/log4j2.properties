# Global configuration properties (Adjust your path here)
property.logPath = E:/Java/microservices/microserviceWithoutSpringBoot/logs
property.fileName = pure-spring-service

# Root Logger Configuration (Routes logs to both Console and File)
rootLogger.level = info
rootLogger.appenderRefs = stdout, rollingFile
rootLogger.appenderRef.stdout.ref = Console
rootLogger.appenderRef.rollingFile.ref = RollingFile

# ----------------------------------------------------
# 1. Console Appender (For IntelliJ terminal output)
# ----------------------------------------------------
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# ----------------------------------------------------
# 2. Rolling File Appender (For physical file logging)
# ----------------------------------------------------
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
# Defines the active log file path
appender.rolling.fileName = ${logPath}/${fileName}.log
# Defines the archive path for old/rolled logs
appender.rolling.filePattern = ${logPath}/archived/${fileName}-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
# Trigger policy: Roll file when it hits 10MB or when the day changes
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
# Strategy: Keep up to 7 archived logs per day
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 7

# Custom levels for framework packages to keep log files readable
logger.spring.name = org.springframework
logger.spring.level = info
logger.tomcat.name = org.apache.catalina
logger.tomcat.level = info
